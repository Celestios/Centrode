[package]
name = "centrode_core"
version = "0.7.0"
edition = "2021"
description = "Core logic and persistence layer for Centrode, exposed via FFI."
authors = ["Celestios <shahin.id5638@gmail.com>"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "generate-schema"
path = "scripts/generate_schema.rs"

[dependencies]
# --- Workspace crates ---
centrode_macros.workspace = true
centrode_daemon.workspace = true

# --- Core Runtime ---
tokio.workspace = true
anyhow.workspace = true
thiserror = "1.0"

# --- The Bridge ---
flutter_rust_bridge = { version = "=2.11.1", features = ["uuid"] }

# --- Database ---
surrealdb.workspace = true

# --- Serialization ---
serde.workspace = true
serde_json = "1.0"
rmp-serde = "1.1"
bincode = "1.3"
uuid.workspace = true

# --- Utilities ---
chrono.workspace = true
directories = "5.0"
zip = "0.6"
walkdir = "2.4"
sha2 = "0.10"

# --- Parallel ---
rayon = "1.10"

# --- Logging ---
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[dev-dependencies]
rand = "0.10.2"
resvg = "0.47.0"
tempfile = "3"
tiny-skia = "0.12.0"
usvg = "0.47.0"

[lints]
workspace = true
