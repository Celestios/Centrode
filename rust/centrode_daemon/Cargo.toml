[package]
name = "centrode_daemon"
version = "0.7.0"
edition = "2021"
description = "Standalone daemon for Centrode — tray, hotkeys, and Custodian IPC."
authors = ["Celestios <shahin.id5638@gmail.com>"]

[[bin]]
name = "centrode-daemon"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
centrode_macros.workspace = true
flutter_rust_bridge.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json = "1.0"
uuid.workspace = true
chrono.workspace = true
surrealdb.workspace = true
directories = "5.0"
interprocess = "2.2"
mio = "1.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
