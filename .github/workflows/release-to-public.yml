name: Package and Publish Multi-Platform Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_NET_OFFLINE: false

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          save-if: true

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

  build-windows:
    name: Build Windows Artifacts
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Flutter & Windows Build Tools
        run: |
          flutter doctor
          flutter config --enable-windows-desktop

      - name: Build Windows Executable & Bundle
        run: flutter build windows --release

      - name: Compile Windows Installer (EXE)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ github.ref_name }}" windows/installer.iss

      - name: Compress Release Bundle
        shell: powershell
        run: |
          $sourceDir = "build\windows\x64\runner\Release"
          $outputZip = "centrode-windows-x64.zip"
          if (Test-Path $sourceDir) {
              Compress-Archive -Path "$sourceDir\*" -DestinationPath $outputZip -Force
          } else {
              Write-Error "Flutter build output directory not found"
              exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe
          retention-days: 1

  build-android-arm64:
    name: Build Android APK (arm64)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Android APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-android-x64:
    name: Build Android APK (x64)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android APK (x64)
        run: flutter build apk --release --target-platform android-x64

      - name: Upload Android APK (x64)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-x64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  build-android-aab:
    name: Build Android AAB (all archs)
    if: false # Disabled — not publishing to Google Play yet
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android AAB (all archs)
        run: flutter build appbundle --release --target-platform android-arm64,android-x64

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  publish-windows:
    name: Publish Windows Artifacts
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts

      - name: Publish Windows Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe

  publish-android:
    name: Publish Android Artifacts
    needs: [build-android-arm64, build-android-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android APK (arm64)
        uses: actions/download-artifact@v4
        with:
          name: android-apk-arm64

      - name: Download Android APK (x64)
        uses: actions/download-artifact@v4
        with:
          name: android-apk-x64

      - name: Publish Android Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            app-release.apk
