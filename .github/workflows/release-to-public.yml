name: Package and Publish Multi-Platform Release

on:
  push:
    tags:
      - "v*"

# Cancel any older run for the same tag if a new one starts — avoids paying
# for duplicate runners if a tag gets re-pushed.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: false

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          save-if: true

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

  build-windows:
    name: Build Windows Artifacts
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Flutter & Windows Build Tools
        run: |
          flutter doctor
          flutter config --enable-windows-desktop

      - name: Build Windows Executable & Bundle
        run: flutter build windows --release

      - name: Compile Windows Installer (EXE)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ github.ref_name }}" windows/installer.iss

      - name: Compress Release Bundle
        shell: powershell
        run: |
          $sourceDir = "build\windows\x64\runner\Release"
          $outputZip = "centrode-windows-x64.zip"
          if (Test-Path $sourceDir) {
              Compress-Archive -Path "$sourceDir\*" -DestinationPath $outputZip -Force
          } else {
              Write-Error "Flutter build output directory not found"
              exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe
          retention-days: 1

  build-android:
    name: Build Android APKs (arm64 + x64)
    needs: setup
    runs-on: ubuntu-latest
    # Was two 90-min jobs on two runners; one job building both ABIs via
    # --split-per-abi uses roughly half the runner-minutes for the same output.
    timeout-minutes: 60

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Add Swap Space
        # Cheap insurance against the exit-code-143 kill: gives Gradle/R8
        # headroom to spike without the OOM killer stepping in, without
        # having to move to a bigger (paid) runner.
        shell: bash
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure Gradle for CI
        # Caps the JVM heap explicitly instead of letting Gradle guess based
        # on total machine RAM (the usual cause of the 143 kill), and turns
        # off the "rich" console so logs show real task-by-task progress
        # instead of one opaque redrawing progress line.
        shell: bash
        run: |
          GRADLE_PROPS="android/gradle.properties"
          touch "$GRADLE_PROPS"
          sed -i \
            -e '/^org\.gradle\.jvmargs/d' \
            -e '/^org\.gradle\.parallel/d' \
            -e '/^org\.gradle\.workers\.max/d' \
            -e '/^org\.gradle\.daemon/d' \
            -e '/^org\.gradle\.console/d' \
            -e '/^kotlin\.daemon\.jvm\.options/d' \
            "$GRADLE_PROPS"
          cat >> "$GRADLE_PROPS" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.console=plain
          kotlin.daemon.jvm.options=-Xmx1024m
          EOF
          echo "----- Final android/gradle.properties -----"
          cat "$GRADLE_PROPS"

      - name: Build Android APKs (arm64 + x64, split per ABI)
        shell: bash
        run: |
          # Background memory sampler: if this ever gets killed again, the
          # uploaded log below shows exactly what RAM looked like leading
          # up to it, instead of a bare exit-143 with no context.
          ( while true; do
              echo "[$(date +%T)] $(free -h | awk 'NR==2{print "mem_used="$3", mem_free="$4}')"
              sleep 30
            done ) > memory-usage.log &
          MONITOR_PID=$!

          echo "::group::flutter build apk --release --split-per-abi (verbose)"
          set +e
          flutter build apk --release \
            --target-platform android-arm64,android-x64 \
            --split-per-abi \
            -v
          BUILD_EXIT=$?
          set -e
          echo "::endgroup::"

          kill "$MONITOR_PID" 2>/dev/null || true
          echo "----- memory-usage.log -----"
          cat memory-usage.log
          exit $BUILD_EXIT

      - name: Upload Memory Usage Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-memory-log
          path: memory-usage.log
          retention-days: 1

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 1

  build-android-aab:
    name: Build Android AAB (all archs)
    if: false # Disabled — not publishing to Google Play yet
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android AAB (all archs)
        run: flutter build appbundle --release --target-platform android-arm64,android-x64

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  publish-windows:
    name: Publish Windows Artifacts
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts

      - name: Publish Windows Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe

  publish-android:
    name: Publish Android Artifacts
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks

      - name: Publish Android Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            app-arm64-v8a-release.apk
            app-x86_64-release.apk