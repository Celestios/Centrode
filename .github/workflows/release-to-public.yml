name: Package and Publish Multi-Platform Release

on:
  push:
    tags:
      - "v*"

# Cancel any older run for the same tag if a new one starts — avoids paying
# for duplicate runners if a tag gets re-pushed.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_NET_OFFLINE: false

jobs:
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          save-if: true

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

  build-windows:
    name: Build Windows Artifacts
    needs: setup
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Flutter & Windows Build Tools
        run: |
          flutter doctor
          flutter config --enable-windows-desktop

      - name: Build Windows Executable & Bundle
        run: flutter build windows --release

      - name: Compile Windows Installer (EXE)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ github.ref_name }}" windows/installer.iss

      - name: Compress Release Bundle
        shell: powershell
        run: |
          $sourceDir = "build\windows\x64\runner\Release"
          $outputZip = "centrode-windows-x64.zip"
          if (Test-Path $sourceDir) {
              Compress-Archive -Path "$sourceDir\*" -DestinationPath $outputZip -Force
          } else {
              Write-Error "Flutter build output directory not found"
              exit 1
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe
          retention-days: 1

  build-android:
    name: Build Android APK (${{ matrix.name }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64
            target_rust: aarch64-linux-android
            abi: arm64-v8a
            name: arm64
          - target: android-x64
            target_rust: x86_64-linux-android
            abi: x86_64
            name: x64

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target_rust }}

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          key: ${{ runner.os }}-rust-${{ matrix.target_rust }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.name }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.name }}-
            ${{ runner.os }}-gradle-

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Add 8GB Swap Space
        shell: bash
        run: |
          echo "=== Configuring 8GB swap file ==="
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Memory & Swap Configuration ==="
          free -h

      - name: Configure Gradle & Rust Environment
        shell: bash
        run: |
          GRADLE_PROPS="android/gradle.properties"
          touch "$GRADLE_PROPS"
          sed -i \
            -e '/^org\.gradle\.jvmargs/d' \
            -e '/^org\.gradle\.parallel/d' \
            -e '/^org\.gradle\.workers\.max/d' \
            -e '/^org\.gradle\.daemon/d' \
            -e '/^org\.gradle\.console/d' \
            -e '/^org\.gradle\.vfs\.watch/d' \
            -e '/^kotlin\.daemon\.jvm\.options/d' \
            "$GRADLE_PROPS"
          cat >> "$GRADLE_PROPS" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.console=plain
          org.gradle.vfs.watch=false
          kotlin.daemon.jvm.options=-Xmx512m
          EOF
          echo "----- Final android/gradle.properties -----"
          cat "$GRADLE_PROPS"

      - name: Build Android APK (${{ matrix.name }})
        shell: bash
        env:
          CARGOKIT_VERBOSE: "1"
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: |
          echo "=== Starting background memory & resource monitor ==="
          ( while true; do
              echo "[$(date +%T)] $(free -h | awk 'NR==2{print "RAM: used="$3" free="$4} NR==3{print "Swap: used="$3" free="$4}')"
              sleep 15
            done ) > memory-usage-${{ matrix.name }}.log &
          MONITOR_PID=$!

          echo "=== Building APK for target platform: ${{ matrix.target }} (ABI: ${{ matrix.abi }}) ==="
          set +e
          flutter build apk --release \
            --target-platform ${{ matrix.target }} \
            -v
          BUILD_EXIT=$?
          set -e

          kill "$MONITOR_PID" 2>/dev/null || true
          echo "=== Memory Usage Summary (last 30 intervals) ==="
          tail -n 30 memory-usage-${{ matrix.name }}.log || true

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Flutter APK build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

          echo "=== Locating and naming output APK ==="
          if [ -f "build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk" "app-${{ matrix.abi }}-release.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "app-${{ matrix.abi }}-release.apk"
          else
            echo "Listing build output directory:"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          ls -lh "app-${{ matrix.abi }}-release.apk"

      - name: Upload Memory Usage Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-memory-log-${{ matrix.name }}
          path: memory-usage-${{ matrix.name }}.log
          retention-days: 1

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ matrix.name }}
          path: app-${{ matrix.abi }}-release.apk
          retention-days: 1

  build-android-aab:
    name: Build Android AAB (all archs)
    if: false # Disabled — not publishing to Google Play yet
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Pub Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android AAB (all archs)
        run: flutter build appbundle --release --target-platform android-arm64,android-x64

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  publish-windows:
    name: Publish Windows Artifacts
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts

      - name: Publish Windows Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            centrode-windows-x64.zip
            centrode-windows-x64-installer.exe

  publish-android:
    name: Publish Android Artifacts
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          pattern: android-release-apk-*
          merge-multiple: true

      - name: Publish Android Artifacts to Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository: Celestios/Centrode
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            app-arm64-v8a-release.apk
            app-x86_64-release.apk