  - name: SubBlockShell
    path: lib/features/graph/ui/widgets/inspector/relation_appearance_section.dart
    description: "Collapsible sub-block within a section shell."
    styles:
      background: black 0.12
      border_radius: 8
      header: "{ fontSize: 9.0, fontWeight: w800 }"

  - name: VisualShapeSelector
    path: lib/features/graph/ui/widgets/inspector/relation_appearance_section.dart
    description: "Grid of visual preview tiles for shape/routing/cap selection."
    styles:
      item:
        padding: "{ horizontal: 8, vertical: 6 }"
