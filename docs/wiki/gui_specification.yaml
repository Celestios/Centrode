# =============================================================================
# Centrode — Full GUI Specification
# =============================================================================
# Comprehensive documentation of all GUI components, styles, behaviors,
# and theme system for the Centrode canvas-based knowledge graph application.
# Generated: 2026-08-09
# =============================================================================

metadata:
  app_name: Centrode
  type: "Flutter + Rust bilingual app"
  description: "Canvas-based knowledge graph with SurrealDB backend via Flutter Rust Bridge"
  version: "1.0.0"

# =============================================================================
# SECTION 1: THEME SYSTEM
# =============================================================================

theme:

  colors:
    core:
      primary: "{ hex: \"#1976D2\", argb: \"0xFF1976D2\", description: \"Material Blue 700\" }"
      secondary: "{ hex: \"#47A2FF\", argb: \"0xFF47A2FF\", description: \"Lighter blue accent\" }"
      accent: "{ hex: \"#FF4081\", argb: \"0xFFFF4081\", description: \"Material Pink A200\" }"
      scaffold_background: "{ hex: \"#F5F5F5\", argb: \"0xFFF5F5F5\" }"
      card: "{ hex: \"#FFFFFF\", argb: \"0xFFFFFFFF\" }"
      divider: "{ hex: \"#BDBDBD\", argb: \"0xFFBDBDBD\" }"
      text: "{ hex: \"#212121\", argb: \"0xFF212121\" }"
      body_text: "{ hex: \"#212121\", argb: \"0xFF212121\" }"

    interaction:
      hover_accent: "{ hex: \"#90CAF9\", argb: \"0xFF90CAF9\", description: \"Light blue hover overlay\" }"
      selection_accent: "{ hex: \"#42A5F5\", argb: \"0xFF42A5F5\", description: \"Blue selection ring\" }"
      editing_accent: "{ hex: \"#2196F3\", argb: \"0xFF2196F3\", description: \"Material Blue 500\" }"

    node_states:
      editing_shadow: "{ argb: \"0x602196F3\", description: \"37% alpha Material Blue 500\" }"
      editing_border: "{ hex: \"#2196F3\" }"
      selected_shadow: "{ argb: \"0x4442A5F5\", description: \"27% alpha Material Blue 400\" }"
      selected_border: "{ hex: \"#42A5F5\" }"
      handle: "{ argb: \"0x03000000\", description: \"1% alpha black\" }"
      expand_toggle: "{ hex: \"#2196F5\" }"
      hover_overlay_alpha:   0.05

    metadata_sphere:
      tags_and_comments: "{ hex: \"#EC407A\", argb: \"0xFFEC407A\" }"
      tags_only: "{ hex: \"#5C6BC0\", argb: \"0xFF5C6BC0\" }"
      comments_only: "{ hex: \"#26A69A\", argb: \"0xFF26A69A\" }"

    tag_defaults:
      - { hex: "#5C6BC0", name: "Indigo" }
      - { hex: "#26A69A", name: "Teal" }
      - { hex: "#EC407A", name: "Pink" }
      - { hex: "#FFA726", name: "Orange" }
      - { hex: "#78909C", name: "Blue Grey" }

    palette_presets:
      - { hex: "#818CF8", name: "Indigo" }
      - { hex: "#34D399", name: "Mint" }
      - { hex: "#FBBF24", name: "Amber" }
      - { hex: "#C084FC", name: "Lavender" }
      - { hex: "#F472B6", name: "Rose" }
      - { hex: "#FB923C", name: "Orange" }
      - { hex: "#94A3B8", name: "Slate" }
      - { hex: "#E2E8F0", name: "Off-White" }
      - { hex: "#EC407A", name: "Pink" }
      - { hex: "#7E57C2", name: "Deep Purple" }
      - { hex: "#42A5F5", name: "Blue" }
      - { hex: "#26A69A", name: "Teal" }

    text_colors:
      - { hex: "#000000", name: "Black" }
      - { hex: "#FFFFFF", name: "White" }
      - { hex: "#0D47A1", name: "Dark Blue" }
      - { hex: "#1B5E20", name: "Dark Green" }
      - { hex: "#880E4F", name: "Dark Pink" }
      - { hex: "#E65100", name: "Dark Orange" }
      - { hex: "#263238", name: "Dark Slate" }

    contrast_text:
      - { bg: "#818CF8", text: "#312E81" }
      - { bg: "#34D399", text: "#064E3B" }
      - { bg: "#FBBF24", text: "#78350F" }
      - { bg: "#C084FC", text: "#581C87" }
      - { bg: "#F472B6", text: "#831843" }
      - { bg: "#FB923C", text: "#7C2D12" }
      - { bg: "#94A3B8", text: "#0F172A" }
      - { bg: "#E2E8F0", text: "#1E293B" }
      - { dark_bg: true, text: "#FFFFFF" }
      - { dark_bg: false, text: "#000000" }

  typography:
    families:
      default: "Roboto"
      canvas_default: "Inter"
      available: ["System", "Inter", "Roboto", "Consolas"]
      code: "Consolas"

    reference_font_size: "{ value: 14.0, unit: \"dp\" }"

    scale:
      body:
        default_size: 14.0
        forest_size: 15.0
        weight_default: "w400"
        weight_forest: "w500"

      node:
        default: 14.0
        min: 10.0
        max: 40.0
        relation_label: 10.0
        badge: 10.0

      heading_levels:
        level_1: "{ size_factor: 1.4, weight: \"bold\" }"
        level_2: "{ size_factor: 1.25, weight: \"bold\" }"
        level_3: "{ size_factor: 1.15, weight: \"bold\" }"

      metadata_preview:
        section_label: "{ size: 10.0, weight: \"w800\", letterSpacing: 1.2 }"
        tag_label: "{ size: 11.0, weight: \"bold\" }"
        comment_text: "{ size: 11.0, height: 1.3 }"
        timestamp: "{ size: 9.0 }"

      window_title_bar:
        app_name: "{ size: 12.0, weight: \"w800\", letterSpacing: 1.5 }"
        subtitle: "{ size: 12.0, weight: \"w400\", letterSpacing: 0.5 }"
        badge_count: "{ size: 8.0, weight: \"bold\" }"

  spacing:
    node:
      padding_base: 8.0
      editing_buffer_width: 45.0
      default_width: 80.0
      min_width: 60.0
      max_width: 640.0
      default_size: "{ width: 100, height: 80 }"
      handle_visual_width: 5.0
      handle_top_offset: 24.0
      expand_toggle_bottom_offset: 20.0

    port:
      edge_offset: 8.0
      hit_radius: 16.0
      draw_radius: 3.0

    relation:
      stroke_width: 3.0
      selected_stroke_width: 4.0
      label_font_size: 10.0
      editor_min_width: 100.0

    toolbar:
      single_width: 90.0
      multi_width: 105.0
      height: 32.0

    canvas:
      boundary_margin: 2000.0
      min_scale: 0.2
      max_scale: 3.0

    grid:
      base_size: 20.0
      dot_radius: 1.5

    panels:
      left_panel_width: 280.0
      right_panel:
        default_width: 280.0
        min_width: 200.0
        max_width: 500.0
      sidebar:
        expanded_width: 220.0
        collapsed_width: 52.0

    glass_panel:
      default_border_radius: 16.0
      border_width: 0.75

  animations:
    durations:
      theme_transition: 400
      short: 100
      standard: 150
      medium: 200
      panel: 250
      badge_pop: 200
      search_debounce: 150
      search_expand: 250
      port_hide: 100
      glass_capture_throttle: 33
      grid_frame_throttle: 33
      glass_warmup_delays: [100, 400, 1000, 2500]

    curves:
      theme_transition: "easeInOut"
      panel_slide: "easeInOut"
      badge_pop: "easeOutBack"
      search_expand: "fastOutSlowIn"
      canvas_pan: "decelerate"

    hover_scale:
      hover: 1.05
      press: 0.95

  effects:
    shadows:
      node_default:
        color: "{ alpha: 0.20 }"
        blur: 4.0
        offset: "{ x: 2.0, y: 2.0 }"

      node_editing:
        color: "{ alpha: 0.37, tint: \"#2196F3\" }"
        blur: 16.0
        spread: 4.0

      node_selected:
        color: "{ alpha: 0.27, tint: \"#42A5F5\" }"
        blur: 8.0

      metadata_preview:
        color: "black26"
        blur: 12.0
        offset: "{ x: 0, y: 4 }"

      glass_performance:
        inner_highlight: "{ color: white, alpha: 0.18, offset: { x: 1.2, y: 1.2 }, blur: 2.0, style: \"inner\" }"
        inner_shadow: "{ color: black, alpha: 0.10, offset: { x: -1.2, y: -1.2 }, blur: 2.0, style: \"inner\" }"

    glassmorphism:
      shader_asset: "shaders/liquid_glass.frag"
      max_concurrent_rects: 4
      settings:
        blend_px: 14.0
        refract_strength: 0.08
        distort_falloff_px: 45.0
        blur_radius_px: 7.0
        spec_angle: 4.0
        spec_strength: 2.0
        spec_power: 100.0
        lightband_strength: 0.9
        bridge_reach_factor: 2.0
        bridge_thickness_factor: 1.0
        aa_px: 1.5

    borders:
      radii:
        default: 8.0
        glass_panel: 16.0
        sidebar: 16.0
        tag_chip: 4.0
        history_badge: 10.0

      widths:
        node_stroke: 1.0
        node_stroke_editing: 3.0
        glass_panel_border: 0.75
        relation_stroke: 3.0
        relation_stroke_selected: 4.0

  theme_modes:
    light:
      brightness: "light"
      primary: "#1976D2"
      scaffold_background: "#F5F5F5"
      card: "#FFFFFF"
      text: "#212121"

    dark:
      brightness: "dark"
      primary: "#9E7AFF"
      scaffold_background: "#000000"
      card: "#16161A"
      text: "#FFFFFF"

    forest:
      brightness: "light"
      primary: "#2E7D32"
      scaffold_background: "#F1F8E9"
      card: "#FFFFFF"
      text: "#1B5E20"

# =============================================================================
# SECTION 2: CANVAS & GRAPH UI COMPONENTS
# =============================================================================

canvas_graph_components:

  - name: GraphScreen
    path: lib/features/graph/ui/graph_screen.dart
    description: "Top-level screen hosting the graph canvas. Manages workspace tab sessions, theme transitions, and scaffold."
    layout:
      type: Scaffold
      body: Stack
      children:
        - IndexedStack: per-session ActiveSessionWidgets
        - Positioned.fill: WorkspaceWindowTitleBar
    behaviors:
      - Tab switching via WorkspaceTabsController
      - Theme transitions with AnimatedTheme (400ms easeInOut)
      - Auto-redirect on all tabs closed

  - name: ActiveSessionWidget
    path: lib/features/graph/ui/graph_screen.dart
    description: "Per-tab session container. Initializes providers and renders GraphCanvas after async init."
    layout:
      type: FutureBuilder
      content: MultiProvider wrapping GraphCanvas

  - name: GraphCanvas
    path: lib/features/graph/ui/canvas/graph_canvas.dart
    description: "Main infinite canvas widget. Manages viewport, interaction engine, drawing interceptor, gesture handling."
    layout:
      type: GlassStage > CanvasInteractiveViewer
      stack_layers:
        - GridLayer: dot grid background
        - RelationLayer: connection lines
        - NodeLayer: all graph nodes
        - OverlayLayer: marquee, opt-area, temp relations, metadata preview
        - PortLayer: connection port indicators
        - ActiveDrawingPainter: transient freehand strokes
    styles:
      glass:
        refract_strength: 0.16
        bridge_reach_factor: 2.0
        bridge_thickness_factor: 0.4
      cursor: dynamic from InteractionController
    behaviors:
      - "Pan & scale (minScale: 0.2, maxScale: 3.0)"
      - Right-click context menu
      - Template drag-and-drop
      - "Mouse position tracking at ~60fps"
      - "Right-click drag detection (5px threshold)"
      - Viewport restore from saved state
      - Elastic margins recalculation

  - name: CanvasOverlayLayout
    path: lib/features/graph/ui/canvas/canvas_overlay_layout.dart
    description: "Positioned overlay system for UI chrome (ribbon, tabs, panels, status bar) on top of canvas."
    layout:
      type: Stack
      positions:
        desktop_header: "{ top: 52px, left: 12px, right: 16px }"
        left_panel_icon_rail: "{ top: 112px, left: 12px, width: 52px }"
        left_panel_content: "{ top: 112px, left: 76px, width: 280px }"
        right_property_panel: "{ top: 112px, right: 12px, bottom: 224px }"
        bottom_status_bar: "{ bottom: 12px, left: 12px, right: 12px }"
    behaviors:
      - Left panel dismiss on outside tap
      - Panel visibility toggled by ValueNotifiers

  - name: NodeWidget
    path: lib/features/graph/ui/canvas/node_widget.dart
    description: "Passive presentational node widget with background, border, shadow, handles, metadata sphere, expand toggle, task badge."
    layout:
      type: Stack
      children:
        - Container: main node body
        - Positioned(right): right resize handle
        - Positioned(left): left resize handle
        - Positioned: metadata sphere (conditional)
    styles:
      node_body:
        background: resolvedStyle.bgColor
        border_radius: resolvedStyle.borderRadius
        border: resolvedStyle.strokeColor, resolvedStyle.strokeWidth
      shadows:
        editing: "{ color: 0x602196F3, blur: 16, spread: 4 }"
        selected: "{ color: 0x4442A5F5, blur: 8, spread: 2 }"
      metadata_sphere:
        radius: 5px * scale
        colors:
          tags_and_comments: 0xFFEC407A
          tags_only: 0xFF5C6BC0
          comments_only: 0xFF26A69A
    behaviors:
      - Shows expand/collapse toggle when lineCount > 3
      - TaskUiNode shows task state badge

  - name: HighlightFrame
    path: lib/features/graph/ui/canvas/widgets/highlight_frame.dart
    description: "Decorative border frame wrapping a node when hovered, selected, or being edited."
    styles:
      gap: 1.5px * scale
      editing: "{ stroke: 1.0, color: 0xFF2196F3 }"
      selected: "{ stroke: 1.0, color: 0xFF42A5F5 }"
      hovered: "{ stroke: 0.5, color: 0xFF90CAF9 }"

  - name: GridLayer
    path: lib/features/graph/ui/canvas/layers/grid_layer.dart
    description: "Infinite dot grid background with mouse-following glow effect."
    styles:
      base_grid_size: 20px
      dot_radius: 1.5px
      dot_color:
        desktop_dark: "{ alpha: 0.08 }"
        desktop_light: "{ alpha: 0.06 }"
      glow_color:
        dark: "{ alpha: 0.65 }"
        light: "{ alpha: 0.85 }"
    behaviors:
      - Mouse glow effect follows cursor with spring-like easing
      - Glow fades in at 6.0 * dt, fades out at 4.0 * dt
      - Velocity-based elliptical stretching
      - Android: static grid only (no glow)

  - name: NodeLayer
    path: lib/features/graph/ui/canvas/layers/node_layer.dart
    description: "Renders all visible nodes using high-performance CustomPainter with Picture caching."
    behaviors:
      - Z-order rendering (back to front)
      - Viewport culling via visibleNodeIds
      - Three-tier repaint optimization (replay/translate/record)
      - Per-node dirty tracking

  - name: RelationLayer
    path: lib/features/graph/ui/canvas/layers/relation_layer.dart
    description: "Renders all relation edges with path caching, live transform, selection highlighting, inline label editing."
    styles:
      default_stroke_width: 3.0
      selected_stroke_width: 4.0
      label_font_size: 10px
      label_background: scaffoldBackgroundColor
    behaviors:
      - Path transform during node drag
      - Tip drag with snap-to-port
      - Stroke patterns: solid, dashed (8px dash, 6px gap), dotted (2px dash, 4px gap)
      - Endpoint shapes: arrow, openArrow, circle, diamond, square, none
      - Selection handles: 6px border circle + 5px fill circle
      - Label visibility modes: auto, always, never

  - name: OverlayLayer
    path: lib/features/graph/ui/canvas/layers/overlay_layer.dart
    description: "Renders transient overlays: temp relation line, marquee selection, opt-area, metadata preview."
    styles:
      marquee: "{ fill: blueAccent 0.2, border: blueAccent, strokeWidth: 1.5 }"
      opt_area: "{ fill: amberAccent 0.15, border: amberAccent, strokeWidth: 2.0 }"
      temp_relation: "{ snapped: green, unsnapped: blueAccent }"

  - name: PortLayer
    path: lib/features/graph/ui/canvas/layers/port_layer.dart
    description: "Renders connection port indicators on hovered nodes."
    styles:
      port_radius: 3px * scale
      normal_color: hoverAccent 0.6
      active_color: selectionAccent 0.9
    behaviors:
      - Shows ports only on hovered node
      - 100ms hide delay after hover leaves
      - Ports hidden during node drag

  - name: CanvasTextEditor
    path: lib/features/graph/ui/canvas/text/canvas_text_editor.dart
    description: "Inline rich text editor for node content with markdown formatting."
    styles:
      cursor_color: 0xFF2196F3
      selection_color: 0x602196F3
      border: "{ color: 0xFF2196F3, alpha: 0.6, width: 1.5 }"
    behaviors:
      - Enter submits, Escape aborts
      - Tab inserts 4 spaces
      - Ctrl+C/V for clipboard
      - Auto-focuses and selects all on mount

  - name: MetadataPreviewOverlay
    path: lib/features/graph/ui/canvas/widgets/metadata_preview_overlay.dart
    description: "Glassmorphic card showing tags and latest comment for a hovered node."
    styles:
      background: "{ color: 0xFF1E1E2E, alpha: 0.85 }"
      blur: sigma 8.0
      border_radius: 8px
      width: 220px
      padding: 12px

  - name: ContextToolbarOverlay
    path: lib/features/graph/ui/canvas/context_toolbar_overlay.dart
    description: "Floating toolbar near selected entities for editing operations."
    styles:
      selection_toolbar: "{ width: 520px, height: 360px }"
      text_format_toolbar: "{ width: 76px, height: 430px }"
    behaviors:
      - Smart positioning (tries left, falls back to right)
      - Clamps to screen boundaries
      - Draggable via dragHandle

# =============================================================================
# SECTION 3: TOOLBAR & OVERLAY COMPONENTS
# =============================================================================

toolbar_components:

  - name: CanvasToolRibbon
    path: lib/features/graph/ui/widgets/overlays/canvas_tool_ribbon.dart
    description: "Top toolbar ribbon wrapping tool/view segmented controls and label mode toggle in GlassPanel."
    layout:
      type: "GlassPanel(blur: 16, borderRadius: 20, padding: EdgeInsets.symmetric(horizontal: 8, vertical: 6))"
      shadow: "{ color: \"Colors.black.withValues(alpha: 0.22)\", blur: 16, spread: -2, offset: \"Offset(0, 6)\" }"
      child: "SingleChildScrollView(scrollDirection: horizontal) > Row"
      tracks: [compact_toggle, tools, views, label_mode]
      track_separator: "GlassDivider (width: 1.2, height: 26)"
      track_wrapper: RibbonCapsule
    behaviors:
      - Compact/expand toggle (desktop only, chevron_right/left icon)
      - Android: compact always, includes Pan tool

  - name: VerticalContextToolbar
    path: lib/features/graph/ui/widgets/overlays/vertical_context_toolbar.dart
    description: "Vertical floating toolbar for node/relation editing. Background GlassPanel bar + interactive column of quick buttons and group buttons."
    layout:
      container: "GlassGroup > SizedBox(width: 520) > Stack"
      background_bar:
        type: GlassPanel
        width: 40
        borderRadius: 10
        blur: 12
        color: "theme.cardColor.withValues(alpha: 0.9)"
        shadow: "{ color: \"Colors.black.withValues(alpha: 0.15)\", blur: 10, offset: Offset(0, 4) }"
      interactive_column:
        padding: "{ vertical: 1, horizontal: 4 }"
        crossAxisAlignment: end (or start if positionOnRight)
    quick_button:
      implementation: "Material(color: transparent) > InkWell(borderRadius: 6) > Container(32x32)"
      icon_size: 20
      icon_color: passed as param (primaryColor or Colors.red.shade400)
      inkwell_border_radius: "BorderRadius.circular(6)"
    group_button:
      trigger:
        type: AnimatedContainer(150ms)
        size: 32x32
        borderRadius: 6
        background_hovered: "primaryColor.withValues(alpha: 0.1)"
        background_default: transparent
        icon_size: 20
        icon_color_hovered: primaryColor
        icon_color_default: "textColor.withValues(alpha: 0.75)"
      submenu:
        type: GlassPanel
        borderRadius: 8
        blur: 10
        color: "theme.cardColor.withValues(alpha: 0.92)"
        padding: "{ horizontal: 4, vertical: 2 }"
        shadow_right: "{ color: \"Colors.black.withValues(alpha: 0.12)\", blur: 8, offset: Offset(2, 2) }"
        shadow_left: "{ color: \"Colors.black.withValues(alpha: 0.12)\", blur: 8, offset: Offset(-2, 2) }"
        gap_from_trigger: 8
      submenu_button:
        type: "HoverScaleButton(hoverScale: 1.08, pressScale: 0.94, borderRadius: 6)"
        size: 28x28
        icon_size: 18
        padding: "{ horizontal: 2 }"
        background_hovered:
          gradient: "[hoverColor 0.18, hoverColor 0.05] top-left to bottom-right"
          border: "{ color: hoverColor 0.3, width: 1.0 }"
          shadow: "{ color: hoverColor 0.08, blur: 4, offset: (0, 1) }"
        icon_color_default: "textColor.withValues(alpha: 0.75)"
        icon_color_hovered: hoverColor
    divider:
      width: 24
      height: 1
      color: "dividerColor.withValues(alpha: 0.3)"

  - name: VerticalTextFormatToolbar
    path: lib/features/graph/ui/widgets/overlays/vertical_text_format_toolbar.dart
    description: "Two-column vertical toolbar for text formatting during node editing."
    styles:
      glass_panel:
        blur: 12
        border_radius: 10
        background: "cardColor.withValues(alpha: 0.9)"
        shadow: "{ color: \"Colors.black.withValues(alpha: 0.15)\", blur: 10, offset: Offset(0, 4) }"
      button:
        size: 28x28
        icon_size: 16
        hover_style:
          gradient: [hoverColor 0.18, hoverColor 0.05]
          border: "{ color: hoverColor 0.3, width: 1.0 }"
          shadow: "{ color: hoverColor 0.08, blur: 4, offset: (0, 1) }"
      dividers:
        horizontal: "{ width: 20, height: 1, margin_vertical: 2, color: \"dividerColor.withValues(alpha: 0.3)\" }"
        vertical: "{ width: 1, height: infinity, margin_horizontal: 2, color: \"dividerColor.withValues(alpha: 0.3)\" }"

  - name: LeftRepositoryDrawer
    path: lib/features/graph/ui/widgets/overlays/left_repository_drawer.dart
    description: "Vertical icon rail for accessing tags, templates, and drawing panels. GlassPanel with icon tiles."
    styles:
      glass_panel:
        borderRadius: 16.0
        blur: 12.0
        color: "theme.cardColor.withValues(alpha: 0.9)"
        shadow: "{ color: \"Colors.black.withValues(alpha: 0.15)\", blur: 10, offset: Offset(3, 3) }"
      icon_tile:
        implementation: "HoverScaleButton(hoverScale: 1.08, pressScale: 0.94, borderRadius: tileBorderRadius)"
        padding: "{ vertical: 14, horizontal: 14 }"
        animation: AnimatedContainer(150ms)
        background_hovered:
          gradient: "[\"primaryColor.withValues(alpha: 0.18)\", \"primaryColor.withValues(alpha: 0.05)\"] top-left to bottom-right"
          border: "{ color: \"primaryColor.withValues(alpha: 0.3)\", width: 1.0 }"
        icon_color_hovered: primaryColor
        icon_color_default: "primaryColor.withValues(alpha: 0.7)"
        icon_animation: AnimatedSwitcher(200ms, ScaleTransition + FadeTransition)
      divider:
        height: 1
        color: "dividerColor.withValues(alpha: 0.3)"
        indent: 8
        endIndent: 8
      top_tile_border_radius: "BorderRadius.vertical(top: Radius.circular(16))"
      bottom_tile_border_radius: "BorderRadius.vertical(bottom: Radius.circular(16))"

  - name: RightPropertyPanel
    path: lib/features/graph/ui/widgets/overlays/right_property_panel.dart
    description: "Right-side inspector panel with collapsible handle, context status badge, tab switcher."
    styles:
      handle:
        width: 42px
        height: 160px
        border_radius: 12
        blur: 12
      content_panel:
        width: "280px (default), min: 200, max: 500"
        border_radius: 16
      tab_bar:
        height: 30
        active: "{ background: primaryColor 0.25, border_radius: 8 }"
    animations:
      container: "{ duration: 250ms, curve: easeInOut }"
    behaviors:
      - Drag to resize panel width
      - Velocity-based auto-expand/collapse
      - Click handle to toggle

  - name: CollapsibleSidebar
    path: lib/features/graph/ui/widgets/overlays/collapsible_sidebar.dart
    description: "Reusable collapsible sidebar container with header and glass panel."
    styles:
      glass_panel:
        border_radius: 16
        blur: 12 (visible), 0 (hidden)
      header:
        height: 32
        title: "{ fontSize: 12, fontWeight: w800, letterSpacing: 1.1 }"
    animations:
      width: "{ duration: 250ms, curve: easeInOut }"

# =============================================================================
# SECTION 4: STATUS BAR COMPONENTS
# =============================================================================

status_bar_components:

  - name: CanvasStatusBar
    path: lib/features/graph/ui/widgets/overlays/canvas_status_bar/canvas_status_bar.dart
    description: "Bottom status bar with manual guide, graph metrics, zoom slider, and minimap."
    layout:
      type: Row (spaceBetween)
      left: GraphManualWidget
      center: StatusMetricsWidget
      right: ZoomSliderWidget + ViewportMiniMapWidget
    responsive:
      minWidth >= 700: show minimap
      minWidth >= 500: show metrics
      minWidth >= 300: show manual

  - name: ZoomSliderWidget
    path: lib/features/graph/ui/widgets/overlays/canvas_status_bar/zoom_slider_widget.dart
    description: "Zoom control with minus/plus buttons, slider, percentage label, and reset button."
    styles:
      slider:
        track_height: 2
        thumb_radius: 5
        active_track: primaryColor
      icon_size: 14
      percent_label: "{ fontSize: 10, fontWeight: bold }"
    behaviors:
      - Zoom range: 0.2 to 3.0
      - Step: 0.1 per click
      - Percentage label clickable to reset to 100%

  - name: ViewportMiniMapWidget
    path: lib/features/graph/ui/widgets/overlays/canvas_status_bar/viewport_mini_map_widget.dart
    description: "200x200 minimap showing overview of all nodes with viewport rectangle."
    styles:
      viewport_fill: primaryColor 0.08
      viewport_border: "{ color: primaryColor 0.5, strokeWidth: 1.0 }"
    behaviors:
      - Click/drag to navigate
      - Snapshot-based rendering
      - Ticker-based viewport tracking (~60fps)

  - name: StatusMetricsWidget
    path: lib/features/graph/ui/widgets/overlays/canvas_status_bar/status_metrics_widget.dart
    description: "Center status bar showing node and relation counts."
    styles:
      text: "{ fontSize: 11, alpha: 0.7 }"

# =============================================================================
# SECTION 5: INSPECTOR COMPONENTS
