  - name: SegmentedGlassSwitcher
    path: lib/features/graph/ui/widgets/inspector/relation_appearance_section.dart
    description: "Glass-style segmented mode switcher."
    styles:
      container: "{ background: black 0.25, border_radius: 8 }"
      selected: "{ background: activeColor 0.28, border_radius: 6 }"
      segment_height: 26

  - name: InlinePropertyRow
    path: lib/features/graph/ui/widgets/inspector/relation_appearance_section.dart
    description: "Inline row with label, color swatch, micro slider, and value readout."
    styles:
      label_width: 75
      label_font_size: 9.5
      color_swatch: 14x14 circle
      slider: "{ track_height: 2, thumb_radius: 5 }"

# =============================================================================
# SECTION 6: SHARED WIDGETS
# =============================================================================

shared_widgets:

  - name: CanvasInteractiveViewer
    path: lib/shared/widgets/canvas_interactive_viewer.dart
    description: "Forked InteractiveViewer with trackpad focal-point fix. Enables pan and zoom."
    styles:
      default_scale: "{ min: 0.8, max: 2.5 }"
      scale_factor: 200.0
    behaviors:
      gestures:
        - scale_start: Records reference focal point
        - scale_update: Applies matrix transforms with boundary clamping
        - scale_end: Friction-based inertia animation
        - pointer_signal: Mouse wheel zoom
        - pointer_pan_zoom: Trackpad PanZoom interception
        - secondary_pan: Right-click drag panning
      inertial_animation:
        curve: "decelerate"
        friction_coefficient: 0.0000135

  - name: ContextMenuOverlay
    path: lib/shared/widgets/context_menu_overlay.dart
    description: "Static utility showing context menu at screen position using Overlay."
    styles:
      material: "{ elevation: 4, border_radius: 4 }"
      item_padding: "{ horizontal: 16, vertical: 8 }"

  - name: UnboundedStack
    path: lib/shared/widgets/unbounded_stack.dart
    description: "Stack that doesn't clip hit tests to bounds. Essential for pannable canvas."
    behaviors:
      hit_testing: Overrides hitTest() to remove bounds check

  - name: UniversalColorPalette
    path: lib/shared/widgets/color_palette/color_palette.dart
    description: "Multi-mode color picker: compactPresets, radial, and advanced modes."
    modes:
      compactPresets:
        type: Wrap
        swatch_size: 28x28
        shape: circle
      radial:
        glass_panel: "{ width: 176, blur: 16, border_radius: 16 }"
        color_ring: "{ width: 130, height: 130, radius: 48 }"
      advanced:
        sections: presets, harmonies, hue_slider, transparency_slider, quick_shuffle
    styles:
      presets: 12 curated colors
      slider_thumb: "{ color: white, radius: 7, elevation: 2 }"
    behaviors:
      - Tap swatches to select color
      - Drag hue/transparency sliders
      - Dropdown for harmony type
      - Shuffle button for random colors

  - name: GlassPanel
    path: lib/shared/widgets/glass_panel/glass_panel.dart
    description: "Core glassmorphic panel with BackdropFilter blur or liquid-glass shader."
    parameters:
      borderRadius: 16.0 (default)
      blur: 10.0 (default)
      color: cardColor at alpha 0.85
      onTap: VoidCallback?
    styles:
      performance_mode:
        gradient: "[color 0.18, color 0.08] top-left to bottom-right"
        border: "{ color: primary 0.225, width: 0.75 }"
        inner_shadows:
          highlight: "{ white, 0.18, offset: (1.2, 1.2), blur: 2.0, style: inner }"
          shadow: "{ black, 0.10, offset: (-1.2, -1.2), blur: 2.0, style: inner }"
      quality_mode:
        fragment_shader: "liquid_glass.frag"
        refraction: true
        specular_highlights: true

  - name: GlassStage
    path: lib/shared/widgets/glass_panel/src/glass_stage.dart
    description: "Captures background at 25% scale for glass panel backdrop sampling."
    styles:
      downsample_scale: 0.25
      capture_throttle: 33ms
      warmup_delays: "[100, 400, 1000, 2500]ms"

  - name: GlassGroup
    path: lib/shared/widgets/glass_panel/src/glass_group.dart
    description: "Scope for bridge blending between descendant glass panels."
    styles:
      max_rects: 4
    behaviors:
      - Loads liquid_glass.frag shader
      - Route animation sync
      - Scroll position sync

  - name: GlassSettings
    path: lib/shared/widgets/glass_panel/src/glass_settings.dart
    description: "Immutable configuration for liquid-glass shader effect."
    defaults:
      blend_px: 14.0
      refract_strength: 0.08
      distort_falloff_px: 45.0
      blur_radius_px: 7.0
      spec_angle: 4.0
      spec_strength: 2.0
      lightband_strength: 0.9
      bridge_reach_factor: 2.0
      aa_px: 1.5

  - name: ColorUtils
    path: lib/shared/utils/color_utils.dart
    description: "Utility for color luminance and contrast calculations."
    methods:
      isDark: Returns true if luminance < 0.5
      getContrastTextColor: Returns high-contrast text color for background
      getContrastStrokeColor: Returns contrast stroke color for background

  - name: ColorHarmonyGenerator
    path: lib/shared/utils/color_harmony_generator.dart
    description: "Generates color harmony palettes from base color."
    methods:
      generateMonochromatic: 5 colors, same hue, varying saturation/value
      generateAnalogous: 5 colors, hue shifted ±30°
      generateComplementary: 4 colors, base + 180° complement
      generateTriadic: 3 colors, base + 120° + 240°

# =============================================================================
# SECTION 7: PRESENTATION WIDGETS
# =============================================================================

presentation_widgets:

  # ---------------------------------------------------------------------------
  # Base Interactive Wrapper
  # ---------------------------------------------------------------------------
  - name: HoverScaleButton
    path: lib/presentation/widgets/hover_scale_button.dart
    description: "Base interactive wrapper used by all buttons. Encapsulates hover detection via MouseRegion, animated scaling via AnimatedScale, tap feedback via Material+InkWell, optional tooltip."
    internal_structure:
      wrapping: "MouseRegion > AnimatedScale > Material(color: transparent) > InkWell"
      tooltip: optional, wraps outermost
    parameters:
      hoverScale: "{ type: double, default: 1.05 }"
      pressScale: "{ type: double, default: 0.95 }"
      duration: "{ type: Duration, default: 100ms }"
      borderRadius: "{ type: BorderRadius, default: \"BorderRadius.circular(10)\" }"
      isEnabled: "{ type: bool, default: true }"
      tooltip: "{ type: String?, default: null }"
    styles:
      material_color: transparent
      inkwell_border_radius: "inherited from borderRadius param, default 10"
    states:
      idle:
        scale: 1.0
      hovered:
        scale: "hoverScale (default 1.05)"
        requires: [isEnabled, onTap]
      pressed:
        scale: "pressScale (default 0.95)"
        requires: [isEnabled, onTap]
      disabled:
        scale: 1.0
        inkwell_tap: null (disabled)
    animations:
      scale: "{ duration: \"inherited (default 100ms)\", curve: default }"

  # ---------------------------------------------------------------------------
  # Window Control Buttons
  # ---------------------------------------------------------------------------
  - name: WindowControlButtons
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Row of three window control buttons (minimize, maximize/restore, close). Each uses HoverScaleButton with hoverScale=1.0, pressScale=1.0 (no scale effect). Tracks window maximize state via WindowListener."
    layout:
      type: "Padding(padding: EdgeInsets.only(right: 8)) > Row(mainAxisSize: min)"
      children: [minimize, SizedBox(4), maximize, SizedBox(4), close]
    button_implementation:
      uses: HoverScaleButton
      hoverScale: 1.0
      pressScale: 1.0
      borderRadius: "BorderRadius.circular(8)"
      builder_returns: AnimatedContainer
    styles:
      button_dimensions:
        width: 32
        height: 32
        borderRadius: 8
      icon:
        size: 16
        color_default: "theme.iconTheme.color?.withValues(alpha: 0.8)"
        color_close_hovered: Colors.white
      background:
        dark_mode:
          default: "Colors.white.withValues(alpha: 0.08)"
          hovered_normal: "Colors.white.withValues(alpha: 0.16)"
          hovered_close: "Colors.red.withValues(alpha: 0.85)"
        light_mode:
          default: "Colors.black.withValues(alpha: 0.06)"
          hovered_normal: "Colors.black.withValues(alpha: 0.12)"
          hovered_close: "Colors.red.withValues(alpha: 0.85)"
    animations:
      background_transition:
        type: AnimatedContainer
        duration: 150ms
        property: decoration (color interpolation)
    behaviors:
      minimize: windowManager.minimize()
      maximizeToggle: windowManager.maximize() / windowManager.unmaximize()
      close: windowManager.close()
      state_tracking: WindowListener for onWindowMaximize / onWindowUnmaximize

  # ---------------------------------------------------------------------------
  # Menu Bar (hover-expandable)
  # ---------------------------------------------------------------------------
  - name: HoverExpandableMenuBar
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Menu bar that starts as hamburger icon (menu_rounded, size 18, alpha 0.7) and expands into full MenuBar on mouse hover. Collapses after 300ms delay on mouse exit. Uses AnimatedCrossFade 200ms for expand/collapse transition."
    layout:
      collapsed: "Container(padding: 4) > Icon(menu_rounded, size: 18, color: bodyMedium.color alpha 0.7)"
      expanded: "SizedBox(height: 32) > Theme > MenuBar > SubmenuButton[]"
    menu_bar_style:
      backgroundColor: Colors.transparent
      elevation: 0
      padding: EdgeInsets.zero
      hover_color_override: "theme.colorScheme.primary.withValues(alpha: 0.1)"
    submenu_button_style:
      minimumSize: Size.zero
      padding: "EdgeInsets.only(left: 10, right: 10, top: 8, bottom: 12)"
      tapTargetSize: MaterialTapTargetSize.shrinkWrap
      shape: "R RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))"
    menu_items:
      - label: "File"
        children:
          - { label: "Force Sync Save", icon: "save_outlined(size: 16)" }
      - label: "View"
        children:
          - { label: "Toggle Left Sidebar", icon: "menu_open_rounded(size: 16)" }
          - { label: "Toggle Right Inspector", icon: "chrome_reader_mode_outlined(size: 16)" }
          - { label: "Toggle Status Bar", icon: "call_to_action_outlined(size: 16)" }
      - label: "Window"
        children:
          - { label: "Toggle Maximize", icon: "crop_square_rounded(size: 16)" }
          - { label: "Minimize Window", icon: "minimize_rounded(size: 16)" }
      - label: "Help"
        children:
          - { label: "About Centrode", icon: "info_outline(size: 16)" }
    animations:
      expand_collapse:
        type: AnimatedCrossFade
        duration: 200ms
        crossFadeState: showFirst (collapsed) / showSecond (expanded)
    behaviors:
      open_trigger: MouseRegion.onEnter
      close_delayed: MouseRegion.onExit -> 300ms Timer -> setState close
      close_immediate: TapRegion.onTapOutside
      lifecycle: dispose() cancels _closeTimer

  # ---------------------------------------------------------------------------
  # Panel Toggle IconButton (in title bar)
  # ---------------------------------------------------------------------------
  - name: PanelToggleButton
    path: lib/presentation/widgets/window_title_bar.dart
    description: "IconButton used for toggling left/right/bottom panels in the workspace title bar."
    styles:
      icon_size: 18
      splash_radius: 18
      padding: "EdgeInsets.all(6)"
      constraints: BoxConstraints() (zero min)
      icon_color_active: "theme.colorScheme.primary"
      icon_color_inactive: "theme.hintColor.withValues(alpha: 0.6)"
    behaviors:
      - ValueListenableBuilder binding to session.showLeftPanel / showRightPanel / showBottomPanel
      - Toggle ValueNotifier value on tap

  # ---------------------------------------------------------------------------
  # Logo / Home Button
  # ---------------------------------------------------------------------------
  - name: LogoHomeButton
    path: lib/presentation/widgets/window_title_bar.dart
    description: "TextButton with home polygon icon and CENTRODE text, both masked by a gradient ShaderMask."
    styles:
      padding: "{ horizontal: 6, vertical: 3 }"
      shape: "RoundedRectangleBorder(borderRadius: BorderRadius.circular(16))"
      shader_gradient:
        colors: "[\"theme.colorScheme.primary\", \"primary.withValues(alpha: 0.7)\"]"
        direction: linear
      polygon:
        size: "Size(18, 20)"
        fill: Colors.white (masked by shader)
        path: "top-right -> left at 45% height -> inner left at 35% width -> bottom -> close"
      text:
        content: "CENTRODE"
        fontWeight: FontWeight.w900
        fontSize: 18
        color: Colors.white (masked by shader)
    behaviors:
      onTap: Navigator.of(context).pop()

  # ---------------------------------------------------------------------------
  # History Badge Button (undo/redo)
  # ---------------------------------------------------------------------------
  - name: HistoryBadgeButton
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Icon button with numeric badge overlay for undo/redo history counts. Uses Tooltip > MouseRegion > InkWell > AnimatedContainer > Stack."
    layout:
      type: "Tooltip > MouseRegion > InkWell(borderRadius: 6) > AnimatedContainer > Stack"
      stack_children:
        - AnimatedScale > Icon
        - "Positioned(top: -6, right: -6): Badge (conditional on count > 0)"
    styles:
      icon:
        size: 18
        color_disabled: "textColor.withValues(alpha: 0.25)"
        color_enabled_default: "textColor.withValues(alpha: 0.85)"
        color_enabled_hovered: "theme.colorScheme.primary"
      hover_background:
        gradient:
          colors: "[\"primary.withValues(alpha: 0.18)\", \"primary.withValues(alpha: 0.08)\"]"
          begin: Alignment.topLeft
          end: Alignment.bottomRight
        border: "{ color: \"primary.withValues(alpha: 0.3)\", width: 1.0 }"
        border_radius: 6
      badge:
        padding: "{ horizontal: 4, vertical: 1 }"
        borderRadius: 10
        background: "theme.colorScheme.primary.withValues(alpha: 0.8)"
        border: "{ color: \"onPrimary.withValues(alpha: 0.4)\", width: 0.8 }"
        constraints: "{ minWidth: 12, minHeight: 12 }"
        text: "{ fontSize: 8, fontWeight: bold, color: onPrimary }"
        shadow: "{ color: black 0.15, blurRadius: 2, offset: (0, 1) }"
    animations:
      icon_scale:
        type: AnimatedScale
        hovered: 1.08
        normal: 1.0
        duration: 150ms
      badge_appear:
        type: AnimatedScale
        visible: "1.0 / hidden: 0.0"
        duration: 200ms
        curve: easeOutBack
      badge_opacity:
        type: AnimatedOpacity
        visible: "1.0 / hidden: 0.0"
        duration: 150ms
      badge_text:
        type: AnimatedSwitcher
        duration: 200ms
        transition: FadeTransition + ScaleTransition composite

  # ---------------------------------------------------------------------------
  # Undo/Redo Container
  # ---------------------------------------------------------------------------
  - name: UndoRedoButtons
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Composite widget wrapping HistoryBadgeButtons with undo/redo counts. Supports horizontal (Row) and vertical (Column) layout modes."
    styles:
      horizontal_mode:
        padding: "{ horizontal: 4, vertical: 2 }"
        background: "Colors.black.withValues(alpha: 0.12)"
        borderRadius: 10
        border: "{ color: \"dividerColor.withValues(alpha: 0.15)\", width: 0.8 }"
        children_spacing: 4
      vertical_mode:
        padding: "{ horizontal: 3, vertical: 6 }"
        background: "Colors.black.withValues(alpha: 0.25)"
        borderRadius: 12
        border: "{ color: \"dividerColor.withValues(alpha: 0.2)\", width: 0.8 }"
        children_spacing: 6
      history_icon:
        size: 18
        padding: 4
        hoverScale: 1.05
        pressScale: 0.95
        borderRadius: 6

  # ---------------------------------------------------------------------------
  # Segmented Control (tool/view selector)
  # ---------------------------------------------------------------------------
  - name: GlassSlidingSegmentedControl
    path: lib/features/graph/ui/widgets/overlays/canvas_tool_ribbon.dart
    description: "Segmented control with animated sliding glass thumb. Uses Listener for pointer drag across segments."
    layout:
      type: "Listener > Container(padding: 2) > Stack"
      item_width: "{ compact: 34, expanded: 88 }"
      item_height: 28
    styles:
      container:
        background: "Colors.black.withValues(alpha: 0.15)"
        borderRadius: 12
        border: "{ color: \"dividerColor.withValues(alpha: 0.08)\", width: 0.8 }"
        padding: 2
      thumb:
        borderRadius: 10
        gradient:
          normal:
            colors: "[\"primaryColor.withValues(alpha: 0.35)\", \"primaryColor.withValues(alpha: 0.16)\"]"
            begin: Alignment.topLeft
            end: Alignment.bottomRight
          pressed:
            colors: "[\"primaryColor.withValues(alpha: 0.50)\", \"primaryColor.withValues(alpha: 0.28)\"]"
        border:
          normal: "{ color: \"primaryColor.withValues(alpha: 0.55)\", width: 1.2 }"
          pressed: "{ color: \"primaryColor.withValues(alpha: 0.85)\", width: 1.2 }"
        shadow:
          normal: "{ color: \"primaryColor.withValues(alpha: 0.25)\", blur: 10, spread: -1, offset: (0, 2) }"
          pressed: "{ color: \"primaryColor.withValues(alpha: 0.45)\", blur: 16, spread: 1, offset: (0, 2) }"
      icon_size: 16
      label_font_size: 11
      label_active_weight: bold
      label_inactive_weight: w500
      label_inactive_alpha: 0.75
      accent_badge:
        padding: "{ horizontal: 3, vertical: 1 }"
        background: primaryColor
        borderRadius: 5
        text: "{ fontSize: 7, fontWeight: w900, color: black }"
    animations:
      thumb_slide:
        type: AnimatedPositioned
        duration: 200ms
        curve: easeOutCubic
      thumb_scale:
        type: AnimatedScale
        pressed: 1.14
        normal: 1.0
        duration: 150ms
        curve: easeOutBack
    behaviors:
      - Pointer drag across segments switches selection
      - Press state affects thumb size, gradient intensity, border alpha, shadow intensity

  # ---------------------------------------------------------------------------
  # Ribbon Capsule (track container)
  # ---------------------------------------------------------------------------
  - name: RibbonCapsule
    path: lib/features/graph/ui/widgets/overlays/canvas_tool_ribbon.dart
    description: "Container wrapping a group of segmented control items. Shows vertical rotated label when expanded."
    styles:
      padding: "{ horizontal: 4, vertical: 3 }"
      background: "Colors.black.withValues(alpha: 0.12)"
      borderRadius: 14
      border: "{ color: \"dividerColor.withValues(alpha: 0.08)\", width: 0.8 }"
      label:
        rotation: "90 degrees (quarterTurns: 3)"
        fontSize: 8
        fontWeight: w900
        letterSpacing: 1.0
        color: "primaryColor.withValues(alpha: 0.85)"
        padding: "{ left: 3, right: 3 }"
      divider:
        width: 1
        height: 18
        margin_right: 4
        color: "dividerColor.withValues(alpha: 0.15)"

  # ---------------------------------------------------------------------------
  # Glass Divider (ribbon separator)
  # ---------------------------------------------------------------------------
  - name: GlassDivider
    path: lib/features/graph/ui/widgets/overlays/canvas_tool_ribbon.dart
    description: "Vertical gradient divider between ribbon tracks."
    styles:
      width: 1.2
      height: 26
      margin: "{ horizontal: 3 }"
      gradient:
        direction: top to bottom
        colors:
          - "dividerColor.withValues(alpha: 0.0)"
          - "dividerColor.withValues(alpha: 0.35)"
          - "dividerColor.withValues(alpha: 0.0)"

  # ---------------------------------------------------------------------------
  # Canvas Tab Bar
  # ---------------------------------------------------------------------------
  - name: CanvasTabBar
    path: lib/features/graph/ui/widgets/overlays/canvas_tab_bar.dart
    description: "Horizontal tab bar for switching workspace maps. Each tab is a GlassPanel inside HoverScaleButton."
    layout:
      type: GlassGroup > Row
      children: [Flexible(SingleChildScrollView > Row of _TabItems), SizedBox(4), _AddTabButton]
    tab_item:
      uses: "HoverScaleButton(hoverScale: 1.04, pressScale: 0.96, borderRadius: 10)"
      glass_panel:
        borderRadius: 10
        color:
          active: "theme.cardColor.withValues(alpha: 0.72)"
          inactive: "theme.cardColor.withValues(alpha: 0.45)"
          hovered: "theme.cardColor.withValues(alpha: 0.60)"
        shadow:
          active: "{ color: \"primaryColor.withValues(alpha: 0.08)\", blur: 8, offset: (0, 2) }"
          inactive: null
      content:
        padding: "{ horizontal: 12, vertical: 6 }"
        icon: "{ size: 14, icon: insert_drive_file_outlined }"
        text: "{ fontSize: 12 }"
        close_icon: "{ size: 14, icon: close_rounded }"
      icon_colors:
        active_icon: onSurface
        inactive_icon: "onSurface.withValues(alpha: 0.6)"
        hovered_icon: primaryColor
      text_colors:
        active: onSurface
        inactive: "onSurface.withValues(alpha: 0.6)"
        hovered: primaryColor
      text_weight:
        active: w600
        inactive: normal
    add_button:
      uses: "HoverScaleButton(hoverScale: 1.05, pressScale: 0.95, borderRadius: 10)"
      glass_panel:
        borderRadius: 10
        color:
          default: "theme.cardColor.withValues(alpha: 0.45)"
          hovered: "theme.cardColor.withValues(alpha: 0.68)"
        shadow:
          hovered: "{ color: \"primaryColor.withValues(alpha: 0.08)\", blur: 4, offset: (0, 1) }"
      icon: "{ size: 14, icon: add_rounded }"
      icon_colors:
        hovered: primaryColor
        default: "onSurface.withValues(alpha: 0.7)"
      padding: 7

  # ---------------------------------------------------------------------------
  # Context Menu
  # ---------------------------------------------------------------------------
  - name: ContextMenuOverlay
    path: lib/shared/widgets/context_menu_overlay.dart
    description: "Static utility that shows a context menu at screen position using OverlayEntry. Menu items in Material with elevation."
    layout:
      type: OverlayEntry > GestureDetector(translucent) > Stack
      positioning: "Positioned(left: position.dx, top: position.dy)"
      menu: "Material > Column(mainAxisSize: min) > _ContextMenuItemWidget[]"
      background: SizedBox.expand() for dismiss tap
    styles:
      material:
        elevation: 4
        borderRadius: "BorderRadius.circular(4)"
      item_widget:
        padding: "{ horizontal: 16, vertical: 8 }"
        inkwell_border_radius: "BorderRadius.circular(4)"
        text_style: default theme text style
    behaviors:
      dismiss: tap outside (GestureDetector.onTap)
      item_tap: executes item.onTap, then dismisses
      visibility: only items with visible=true shown

  # ---------------------------------------------------------------------------
  # Left Repository Panel
  # ---------------------------------------------------------------------------
  - name: LeftRepositoryPanel
    path: lib/presentation/widgets/left_repository_panel.dart
    description: "Fixed left-side panel container wrapping content in GlassPanel with bold uppercase title header."
    layout:
      type: "GlassPanel(padding: EdgeInsets.zero, blur: 12.0, borderRadius: 16.0) > Column"
      children:
        - "Padding(left: 16, top: 16, bottom: 8) > Text(title)"
        - Flexible > child
    styles:
      title:
        fontWeight: bold
        letterSpacing: 1.2
        fontSize: 13
        color: "theme.colorScheme.onSurface"

  # ---------------------------------------------------------------------------
  # Simple Window Title Bar
  # ---------------------------------------------------------------------------
  - name: SimpleWindowTitleBar
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Minimal custom window title bar for non-workspace screens. Desktop only."
    styles:
      height: 38
      background: "theme.colorScheme.surface"
      brand_name: "{ fontSize: 12, fontWeight: w800, letterSpacing: 1.5, color: bodyMedium.color }"
      subtitle: "{ text: \"  Workspace Hub\", fontSize: 12, fontWeight: w400, letterSpacing: 0.5, color: bodySmall.color }"
    behaviors:
      - Entire bar is DragToMoveArea
      - WindowControlButtons positioned right

  # ---------------------------------------------------------------------------
  # Workspace Title Bar
  # ---------------------------------------------------------------------------
  - name: WorkspaceWindowTitleBar
    path: lib/presentation/widgets/window_title_bar.dart
    description: "Full-featured workspace title bar. GlassPanel with borderRadius 0, blur 16, cardColor alpha 0.65."
    styles:
      glass_panel:
        borderRadius: 0
        blur: 16.0
        color: "theme.cardColor.withValues(alpha: 0.65)"
        height: 40
        shadow: "{ color: \"dividerColor.withValues(alpha: 0.2)\", blur: 0, offset: (0, 1) }"
      vertical_divider:
        width: 1
        height: 20
        color: "dividerColor.withValues(alpha: 0.2)"
    behaviors:
      - SearchCommandPalette centered
      - UndoRedoButtons translate offset based on search focus (-172 vs -262)

  # ---------------------------------------------------------------------------
  # Search Command Palette
  # ---------------------------------------------------------------------------
  - name: SearchCommandPalette
    path: lib/presentation/widgets/search/search_command_palette.dart
    description: "Command palette with animated width expansion, glass styling, overlay dropdown, keyboard navigation."
    styles:
      collapsed_width: 240.0
      expanded_width: 420.0
      height: 28
      glass_collapsed:
        borderRadius: 8
        blur: 10.0
        color: "onSurface.withValues(alpha: 0.06)"
        shadow: null
      glass_expanded:
        borderRadius: 8
        blur: 10.0
        color: "theme.cardColor.withValues(alpha: 0.85)"
        shadow: "{ color: \"primary.withValues(alpha: 0.2)\", blur: 8, spread: 1 }"
      search_icon:
        size: 14
        color_focused: primary
        color_unfocused: "iconTheme.color.withValues(alpha: 0.4)"
      text_field:
        style: "{ fontSize: 12 }"
        hint: "Search ('>' cmd, '#' tag, '?' db)..."
        hint_style: "{ color: \"hintColor.withValues(alpha: 0.7)\", fontSize: 12 }"
        border: InputBorder.none
    animations:
      width:
        duration: 250ms
        curve_focused: fastOutSlowIn
        curve_unfocused: easeOutCubic
    behaviors:
      - Debounced search 150ms
      - Keyboard: arrow_down/up, enter, escape
      - Overlay show/hide on focus

  # ---------------------------------------------------------------------------
  # Search Overlay
  # ---------------------------------------------------------------------------
  - name: SearchOverlayWidget
    path: lib/presentation/widgets/search/search_overlay_widget.dart
    description: "Dropdown overlay showing search results. Standard items, relation headers with verb badges, relation items with from->verb->to previews."
    styles:
      glass:
        borderRadius: 12
        blur: 12
        color: "cardColor.withValues(alpha: 0.92)"
        shadow: "{ color: black 0.18, blur: 16, offset: (0, 4) }"
      result_item:
        padding: "{ horizontal: 14, vertical: 8 }"
        icon_size: 18
        icon_color_default: "iconTheme.color.withValues(alpha: 0.7)"
        icon_color_selected: primary
        selected_background: "primary.withValues(alpha: 0.15)"
      relation_header:
        padding: "{ left: 14, right: 14, top: 14, bottom: 8 }"
        verb_badge:
          padding: "{ horizontal: 8, vertical: 3 }"
          borderRadius: 6
          background: "verbColor.withValues(alpha: 0.1)"
          border: "{ color: \"verbColor.withValues(alpha: 0.4)\", width: 1 }"
      relation_item:
        padding: "{ left: 28, right: 14, top: 8, bottom: 8 }"
        icon_size: 14

  # ---------------------------------------------------------------------------
  # Searchable Sorted List Header
  # ---------------------------------------------------------------------------
  - name: SearchableSortedListHeader
    path: lib/presentation/widgets/search/searchable_sort_list_header.dart
    description: "Generic header for searchable, sortable lists with search field and sort PopupMenuButton."
    styles:
      search_field:
        height: 32
        fontSize: 12
        fillColor: "Colors.black.withValues(alpha: 0.15)"
        borderRadius: 8
        border: "OutlineInputBorder(borderRadius: 8, borderSide: none)"
        prefix_icon: "{ size: 14, color: \"onSurface.withValues(alpha: 0.5)\" }"
      sort_button:
        icon_size: 16
        icon_color: "onSurface.withValues(alpha: 0.6)"
      sort_menu:
        borderRadius: 8
        elevation: 6
        color: "cardColor.withValues(alpha: 0.95)"
        border: "{ color: \"dividerColor.withValues(alpha: 0.15)\", width: 1 }"
        animation: noAnimation

# =============================================================================
# SECTION 8: WORKSPACE UI COMPONENTS
# =============================================================================

workspace_components:

  - name: WorkspaceHubScreen
    path: lib/features/workspace/ui/workspace_hub_screen.dart
    description: "Root screen for workspace hub with left panel, main content, drag-to-move title bar, window controls."
    styles:
      scaffoldBackgroundColor: "#000000"
    layout:
      desktop: Row [LeftPanel(200px) + MainContentArea]
      android: Full-width content with drawer
    behaviors:
      - Platform detection for layout
      - Drag-to-move area on desktop

  - name: LiquidGlassDemo
    path: lib/features/workspace/ui/liquid_glass_test_screen.dart
    description: "Interactive demo for liquid glass shader with draggable panels and control sliders."
    styles:
      glassPanels:
        - { name: "Amber Glass", width: 250, height: 80, borderRadius: 40, color: amber 100 }
        - { name: "Green ECO", width: 100, height: 100, borderRadius: 50, color: lightGreen 200 }
        - { name: "Tall Icons", width: 80, height: 120, borderRadius: 20 }
        - { name: "Dark Circle", width: 60, height: 60, borderRadius: 30, color: black 150 }
    behaviors:
      - Drag panels within constraints
      - Slider controls for shader parameters

  - name: LeftPanel
    path: lib/features/workspace/ui/widgets/left_panel/left_panel.dart
    description: "Fixed-width left sidebar with rounded right corners and Material background."
    styles:
      width: 200
      borderRadius: "{ topRight: 16, bottomRight: 16 }"
      borderRight: dividerColor 0.2

  - name: MainContentArea
    path: lib/features/workspace/ui/widgets/main_content/main_content_area.dart
    description: "Main content area with title bar, scrollable MapsSection, and AnalyticsBox."
    styles:
      title_bar: "{ height: 48 }"
      brand_text: "\"CENTRODE\" { fontSize: 12, fontWeight: w800, letterSpacing: 1.5 }"

  - name: QuickActionsSection
    path: lib/features/workspace/ui/widgets/left_panel/quick_actions_section.dart
    description: "Left panel with Return to Map, Open/Import tiles, and New Map button."
    styles:
      return_button:
        padding: "{ vertical: 10, horizontal: 12 }"
        borderRadius: 10
        enabledHover: primaryColor 0.18
      new_map_button: "{ size: 48x48, borderRadius: 8 }"

  - name: SectionHeader
    path: lib/features/workspace/ui/widgets/shared/section_header.dart
    description: "Section header with uppercase title and optional selection toolbar."
    styles:
      title: "{ fontWeight: w600, letterSpacing: 1.5 }"
      action_button: "{ padding: { horizontal: 8, vertical: 2 }, borderRadius: 4 }"

  - name: HorizontalScrollRow
    path: lib/features/workspace/ui/widgets/shared/horizontal_scroll_row.dart
    description: "Horizontal scrolling row of equally-sized cards."
    styles:
      rowHeight: 160
      itemWidth: 180
      itemSpacing: 12

  - name: WindowControlButtons (workspace)
    path: lib/features/workspace/ui/widgets/window_controls.dart
    description: "Window control buttons with hover state animation."
    styles:
      button: "{ width: 32, height: 32, borderRadius: 8 }"
      defaultBackground: white 0.08
      hoveredBackground: white 0.16
      closeHoveredBackground: red 0.85

# =============================================================================
# SECTION 9: DRAWING & TAG COMPONENTS
# =============================================================================

drawing_tag_components:

  - name: GlobalDrawingPanel
    path: lib/features/graph/ui/widgets/drawing_manager/global_drawing_panel.dart
    description: "Left panel for brush settings: type selection, color palette, and thickness picker."
    styles:
      brush_type_item:
        padding: "{ horizontal: 12, vertical: 8 }"
        border_radius: 8
        active_background: primary 0.15
        icon_size: 16
      thickness_option: "{ container: 20x20 circle }"
    brush_types:
      - pen (edit_rounded)
      - highlighter (highlight_rounded)
      - line (linear_scale_rounded)
    thicknesses: [2.0, 4.0, 8.0, 12.0, 16.0]
    color_presets:
      - 0xFF00E5FF (cyan)
      - 0xFFD500F9 (purple)
      - 0xFFFF6D00 (orange)
      - 0xFFFFD600 (yellow)
      - 0xFFFFFFFF (white)
      - 0xFF818CF8 (indigo)
      - 0xFF34D399 (green)
      - 0xFFFBBF24 (amber)

  - name: GlobalTagsManagerPanel
    path: lib/features/graph/ui/widgets/tag_manager/global_tags_manager_panel.dart
    description: "Left panel wrapper for global tags management."
    layout:
      type: "LeftRepositoryPanel(title: \"GLOBAL TAGS\")"

  - name: GlobalTemplatesManagerPanel
    path: lib/features/graph/ui/widgets/template_manager/global_templates_manager_panel.dart
    description: "Left panel wrapper for global templates management."
    layout:
      type: "LeftRepositoryPanel(title: \"TEMPLATES\")"

  - name: TagColorPickerPanel
    path: lib/features/graph/ui/widgets/tag_manager/tag_color_picker_panel.dart
    description: "Radial color picker for tag colors."
    layout:
      type: "UniversalColorPalette(mode: radial, showAlpha: false)"

  - name: TemplatePreviewPainter
    path: lib/features/graph/ui/widgets/template_manager/template_preview_painter.dart
    description: "CustomPainter rendering mini preview of template nodes and relations."
    styles:
      scale: min(targetScale, 0.4)
      relation_line: "{ color: white 0.3, strokeWidth: 1.2 }"
      node_border: "{ color: white 0.2, strokeWidth: 0.6 }"

# =============================================================================
# SECTION 10: CONFIGURATION CONSTANTS
# =============================================================================

app_config:
  grid:
    base_size: 20.0
    dot_radius: 1.5

  canvas:
    boundary_margin: 2000.0
    min_scale: 0.2
    max_scale: 3.0
    scale_factor: 1000.0

  interaction:
    double_tap_ms: 300
    snap_distance: 40.0
    resize_edge_width: 15.0
    relation_tip_hit_distance: 24.0

  node:
    default_width: 80.0
    min_width: 60.0
    max_width: 640.0
    collapsed_line_limit: 3
    default_size: "{ width: 100, height: 80 }"
    default_font_size: 14.0
    metadata_preview_width: 220.0
    metadata_preview_blur: 8.0

  port:
    edge_offset: 8.0
    hit_radius: 16.0
    draw_radius: 3.0

  relation:
    stroke_width: 3.0
    selected_stroke_width: 4.0
    label_font_size: 10.0

  visuals:
    hover_accent: 0xFF90CAF9
    selection_accent: 0xFF42A5F5
    default_font: "Inter"
    default_shape: "rectangle"
    available_fonts: ["System", "Inter", "Roboto", "Consolas"]

  liquid_glass:
    refract_strength: 0.16
    bridge_reach_factor: 2.0
    bridge_thickness_factor: 0.4
    use_local_coordinates: true

# =============================================================================
# SECTION 11: GLOBAL STYLES SUMMARY
# =============================================================================

global_styles:

  glassmorphism_system:
    description: "All panels use GlassPanel with BackdropFilter blur, gradient overlay, dual inner shadows"
    default_blur: 10.0
    default_border_radius: 16.0
    default_color: cardColor at alpha 0.85
    gradient: "[color 0.18, color 0.08] top-left to bottom-right"
    inner_highlight: white 0.18, offset (1.2, 1.2)
    inner_shadow: black 0.10, offset (-1.2, -1.2)
    border: primary at alpha 0.225, width 0.75

  animation_durations:
    micro_interaction: 100ms
    hover_scale: 100ms
    container_transition: 150ms
    menu_expand: 200ms
    width_expand: 250ms
    badge_appear: 200ms
    theme_transition: 400ms
    search_debounce: 150ms

  typography_scale:
    window_title_brand: 18px w900
    window_title_subtitle: 12px w400
    panel_title: "13px w700 ls:1.2"
    menu_label: 12px
    body: 14px w400
    search_input: 12px
    badge_count: 8px w700
    node_preview: 10px w600

  spacing_system:
    panel_title_padding: "{ left: 16, top: 16, bottom: 8 }"
    button_padding_standard: 6 all
    section_gap_xs: 4
    section_gap_sm: 6
    section_gap_md: 8
    section_gap_lg: 12

  responsive:
    strategy: "none — uses MediaQuery dynamically"
    canvas_scale: "{ min: 0.2, max: 3.0 }"
    panel_velocity_threshold: 300 dp/s
